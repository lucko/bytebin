name: Build Docker Image

on:
  push:
    branches:
      - '*'
    tags:
      - 'v*'
  pull_request:
    branches:
      - 'master'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
          cache: maven

      - name: Build jar
        run: mvn --no-transfer-progress -B package

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image for smoke tests
        uses: docker/build-push-action@v7
        with:
          context: .
          target: prebuilt
          load: true
          tags: bytebin:smoke

      - name: Start bytebin
        run: |
          docker run -d --name bytebin -p 8080:8080 bytebin:smoke
          for i in $(seq 1 30); do
            curl -fs http://localhost:8080/health && exit 0
            sleep 2
          done
          docker logs bytebin
          exit 1

      - name: Run smoke tests
        run: mvn --no-transfer-progress -B failsafe:integration-test failsafe:verify -Dbytebin.url=http://localhost:8080

      - name: Print bytebin logs on failure
        if: failure()
        run: docker logs bytebin

      - name: Stop bytebin
        if: always()
        run: docker rm -f bytebin

      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: |
            latest=${{ github.ref == 'refs/heads/master' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: prebuilt
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
